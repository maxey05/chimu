<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chimu web checks</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5em; color: #1d1f1e; }
    #summary { font-size: 1.3em; font-weight: 700; margin: 0.5em 0 1em; }
    #summary.ok::before { content: "ALL PASS: "; }
    #summary.bad::before { content: "FAILURES: "; }
    ul { list-style: none; padding: 0; }
    li { padding: 0.15em 0; }
    .tag { display: inline-block; min-width: 3.2em; font-weight: 700; }
    .fail .msg { display: block; margin-left: 3.4em; color: #a4161a; }
  </style>
</head>
<body>
  <h1>Chimu web checks</h1>
  <p>Money formatting, CSV export, totals, filters, edit validation and loading. Nothing here talks to Supabase.</p>
  <p id="summary" aria-live="polite">Running…</p>
  <ul id="results"></ul>
  <script type="module">
    import { makeT, summary } from './check.js';

    const modules = ['./test-csv.js', './test-core.js', './test-stats.js', './test-budgets.js'];
    const t = makeT();
    const list = document.getElementById('results');
    const sum = document.getElementById('summary');
    try {
      for (const name of modules) {
        const m = await import(name);
        m.tests(t);
      }
      await t.settle();
    } catch (e) {
      t.results.push({ name: 'test modules load', ok: false, error: String((e && e.message) || e) });
    }
    for (const r of t.results) {
      const li = document.createElement('li');
      li.className = r.ok ? 'pass' : 'fail';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = r.ok ? 'PASS' : 'FAIL';
      li.append(tag, document.createTextNode(r.name));
      if (!r.ok) {
        const msg = document.createElement('span');
        msg.className = 'msg';
        msg.textContent = r.error;
        li.append(msg);
      }
      list.append(li);
    }
    const { total, passed, failed } = summary(t.results);
    sum.className = failed.length ? 'bad' : 'ok';
    sum.textContent = `${passed}/${total} checks passed`;
  </script>
</body>
</html>
